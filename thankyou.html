<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Haven - Thank You!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-thankyou">
    <div class="thankyou-container">
        <div class="thankyou-content">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h1>Order Placed Successfully!</h1>
            
            <p class="thankyou-message">
                Thank you for choosing <strong>Flavor Haven</strong>! Your order has been received and our kitchen is already preparing your delicious meal with love and care.
            </p>
            
            <div class="order-info">
                <div class="info-card">
                    <i class="fas fa-clock"></i>
                    <h3>Estimated Time</h3>
                    <p>15-20 minutes</p>
                </div>
                
                <div class="info-card">
                    <i class="fas fa-hashtag"></i>
                    <h3>Order Number</h3>
                    <p>#FH-2026</p>
                </div>
            </div>
            
            <div class="thankyou-actions">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i>
                    Back to Home
                </a>
                
                <a href="index.html" class="btn-secondary">
                    <i class="fas fa-plus"></i>
                    Order More
                </a>
            </div>
</body>
</html>
