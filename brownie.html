<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Haven - Chocolate Lava Brownie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-item">
    <header class="page-header">
        <a href="desserts.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Order Details</h1>
    </header>
    <div class="item-detail">
        <div class="item-hero">
            <img src="images/Chocolate-Lava-Brownie.jpg">
            </div>
        </div>
        <div class="item-content">
            <h1 class="item-name">Chocolate Lava Brownie</h1>
            <div class="item-meta">
                <div class="meta-item"><i class="fas fa-dollar-sign"></i><span class="item-price">$8.99</span></div>
                <div class="meta-item"><i class="fas fa-utensils"></i><span>Serves 1</span></div>
            </div>
            <div class="item-description">
                <p>Decadent warm chocolate brownie with a molten chocolate center that flows out when you cut into it. Served with vanilla ice cream and chocolate drizzle. Pure chocolate heaven!</p>
            </div>
            <form class="order-form" action="thankyou.html" method="get">
                <div class="form-section">
                    <h3>Choose Your Extras</h3>
                    <ul class="extras-list">
                        <li><input type="checkbox" id="extra1" name="extras" value="icecream"><label for="extra1"><span class="extra-name">Double Ice Cream</span><span class="extra-price">+$2.50</span></label></li>
                        <li><input type="checkbox" id="extra2" name="extras" value="whipped"><label for="extra2"><span class="extra-name">Whipped Cream</span><span class="extra-price">+$1.00</span></label></li>
                        <li><input type="checkbox" id="extra3" name="extras" value="nuts"><label for="extra3"><span class="extra-name">Crushed Nuts</span><span class="extra-price">+$1.50</span></label></li>
                        <li><input type="checkbox" id="extra4" name="extras" value="raspberry"><label for="extra4"><span class="extra-name">Raspberry Sauce</span><span class="extra-price">+$1.50</span></label></li>
                    </ul>
                </div>
                <div class="form-section">
                    <h3>Special Requests</h3>
                    <textarea name="notes" id="notes" placeholder="Any allergies, dietary preferences, or special instructions? Let us know here..." rows="4"></textarea>
                </div>
                <button type="submit" class="order-btn"><i class="fas fa-shopping-cart"></i>Place Order</button>
            </form>
        </div>
    </div>
</body>
</html>
