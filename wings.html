<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Haven - Buffalo Wings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-item">
    <header class="page-header">
        <a href="starters.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Order Details</h1>
    </header>
    <div class="recipe-image">
        <div class="recipe-image">
            <img src="images/buffalo-wings.jpg"
                <i class="fas fa-drumstick-bite"></i>
            </div>
        </div>
        <div class="item-content">
            <h1 class="item-name">Buffalo Wings</h1>
            <div class="item-meta">
                <div class="meta-item"><i class="fas fa-dollar-sign"></i><span class="item-price">$10.99</span></div>
                <div class="meta-item"><i class="fas fa-utensils"></i><span>10 pieces</span></div>
            </div>
            <div class="item-description">
                <p>Crispy chicken wings tossed in our signature spicy buffalo sauce. Served with cool blue cheese dip and fresh celery sticks. Choose your heat level from mild to extra hot!</p>
            </div>
            <form class="order-form" action="thankyou.html" method="get">
                <div class="form-section">
                    <h3>Choose Your Extras</h3>
                    <ul class="extras-list">
                        <li><input type="checkbox" id="extra1" name="extras" value="ranch"><label for="extra1"><span class="extra-name">Ranch Dip</span><span class="extra-price">+$1.00</span></label></li>
                        <li><input type="checkbox" id="extra2" name="extras" value="celery"><label for="extra2"><span class="extra-name">Extra Celery</span><span class="extra-price">+$0.50</span></label></li>
                        <li><input type="checkbox" id="extra3" name="extras" value="carrots"><label for="extra3"><span class="extra-name">Carrot Sticks</span><span class="extra-price">+$0.75</span></label></li>
                        <li><input type="checkbox" id="extra4" name="extras" value="fries"><label for="extra4"><span class="extra-name">French Fries</span><span class="extra-price">+$3.00</span></label></li>
                    </ul>
                </div>
                <div class="form-section">
                    <h3>Special Requests</h3>
                    <textarea name="notes" id="notes" placeholder="Any allergies, dietary preferences, or special instructions? Let us know here..." rows="4"></textarea>
                </div>
                <button type="submit" class="order-btn"><i class="fas fa-shopping-cart"></i>Place Order</button>
            </form>
        </div>
    </div>
</body>
</html>
