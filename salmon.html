<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Haven - Grilled Salmon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-item">
    <header class="page-header">
        <a href="meals.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Order Details</h1>
    </header>
    <div class="item-detail">
        <div class="item-hero">
            <img src="images/grilled-salmon.jpg" alt="Grilled Salmon">
            </div>
        </div>
        <div class="item-content">
            <h1 class="item-name">Grilled Salmon</h1>
            <div class="item-meta">
                <div class="meta-item"><i class="fas fa-dollar-sign"></i><span class="item-price">$22.99</span></div>
                <div class="meta-item"><i class="fas fa-utensils"></i><span>Serves 1</span></div>
            </div>
            <div class="item-description">
                <p>Fresh Atlantic salmon fillet grilled to perfection, topped with herb butter and served with seasonal roasted vegetables and your choice of wild rice or creamy mashed potatoes. A healthy and delicious choice!</p>
            </div>
            <form class="order-form" action="thankyou.html" method="get">
                <div class="form-section">
                    <h3>Choose Your Extras</h3>
                    <ul class="extras-list">
                        <li><input type="checkbox" id="extra1" name="extras" value="asparagus"><label for="extra1"><span class="extra-name">Grilled Asparagus</span><span class="extra-price">+$3.00</span></label></li>
                        <li><input type="checkbox" id="extra2" name="extras" value="lemon"><label for="extra2"><span class="extra-name">Lemon Butter Sauce</span><span class="extra-price">+$2.00</span></label></li>
                        <li><input type="checkbox" id="extra3" name="extras" value="rice"><label for="extra3"><span class="extra-name">Extra Wild Rice</span><span class="extra-price">+$2.50</span></label></li>
                        <li><input type="checkbox" id="extra4" name="extras" value="salad"><label for="extra4"><span class="extra-name">Garden Salad</span><span class="extra-price">+$4.00</span></label></li>
                    </ul>
                </div>
                <div class="form-section">
                    <h3>Special Requests</h3>
                    <textarea name="notes" id="notes" placeholder="Any allergies, dietary preferences, or special instructions? Let us know here..." rows="4"></textarea>
                </div>
                <button type="submit" class="order-btn"><i class="fas fa-shopping-cart"></i>Place Order</button>
            </form>
        </div>
    </div>
</body>
</html>
