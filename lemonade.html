<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Haven - Fresh Lemonade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-item">
    <header class="page-header">
        <a href="drinks.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Order Details</h1>
    </header>
   <div class="recipe-image">
        <div class="recipe-image">
            <img src="images/Fresh-lemonade.jpg" alt="Fresh Lemonade">
            </div>
        </div>
        <div class="item-content">
            <h1 class="item-name">Fresh Lemonade</h1>
            <div class="item-meta">
                <div class="meta-item"><i class="fas fa-dollar-sign"></i><span class="item-price">$4.99</span></div>
                <div class="meta-item"><i class="fas fa-utensils"></i><span>16 oz</span></div>
            </div>
            <div class="item-description">
                <p>House-made fresh lemonade using real lemons, lightly sweetened and infused with fresh mint and a hint of ginger. Perfectly refreshing on a warm day!</p>
            </div>
            <form class="order-form" action="thankyou.html" method="get">
                <div class="form-section">
                    <h3>Choose Your Extras</h3>
                    <ul class="extras-list">
                        <li><input type="checkbox" id="extra1" name="extras" value="strawberry"><label for="extra1"><span class="extra-name">Strawberry Flavor</span><span class="extra-price">+$1.00</span></label></li>
                        <li><input type="checkbox" id="extra2" name="extras" value="mint"><label for="extra2"><span class="extra-name">Extra Mint</span><span class="extra-price">+$0.50</span></label></li>
                        <li><input type="checkbox" id="extra3" name="extras" value="lavender"><label for="extra3"><span class="extra-name">Lavender Syrup</span><span class="extra-price">+$1.50</span></label></li>
                        <li><input type="checkbox" id="extra4" name="extras" value="size"><label for="extra4"><span class="extra-name">Upgrade to 24 oz</span><span class="extra-price">+$2.00</span></label></li>
                    </ul>
                </div>
                <div class="form-section">
                    <h3>Special Requests</h3>
                    <textarea name="notes" id="notes" placeholder="Any allergies, dietary preferences, or special instructions? Let us know here..." rows="4"></textarea>
                </div>
                <button type="submit" class="order-btn"><i class="fas fa-shopping-cart"></i>Place Order</button>
            </form>
        </div>
    </div>
</body>
</html>
