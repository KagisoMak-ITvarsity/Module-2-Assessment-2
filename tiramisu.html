<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Haven - Tiramisu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-item">
    <header class="page-header">
        <a href="desserts.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Order Details</h1>
    </header>
    <div class="item-detail">
        <div class="item-hero">
            <img src="images/Tiramisu.jpg" alt="Tiramisu">
            </div>
        </div>
        <div class="item-content">
            <h1 class="item-name">Tiramisu</h1>
            <div class="item-meta">
                <div class="meta-item"><i class="fas fa-dollar-sign"></i><span class="item-price">$10.99</span></div>
                <div class="meta-item"><i class="fas fa-utensils"></i><span>Serves 1</span></div>
            </div>
            <div class="item-description">
                <p>Authentic Italian dessert with layers of espresso-soaked ladyfinger cookies and creamy mascarpone cheese, dusted with cocoa powder. A sophisticated and delightful finish to any meal.</p>
            </div>
            <form class="order-form" action="thankyou.html" method="get">
                <div class="form-section">
                    <h3>Choose Your Extras</h3>
                    <ul class="extras-list">
                        <li><input type="checkbox" id="extra1" name="extras" value="chocolate"><label for="extra1"><span class="extra-name">Chocolate Shavings</span><span class="extra-price">+$1.50</span></label></li>
                        <li><input type="checkbox" id="extra2" name="extras" value="amaretto"><label for="extra2"><span class="extra-name">Amaretto Drizzle</span><span class="extra-price">+$2.00</span></label></li>
                        <li><input type="checkbox" id="extra3" name="extras" value="espresso"><label for="extra3"><span class="extra-name">Double Espresso</span><span class="extra-price">+$3.00</span></label></li>
                        <li><input type="checkbox" id="extra4" name="extras" value="berries"><label for="extra4"><span class="extra-name">Fresh Berries</span><span class="extra-price">+$2.50</span></label></li>
                    </ul>
                </div>
                <div class="form-section">
                    <h3>Special Requests</h3>
                    <textarea name="notes" id="notes" placeholder="Any allergies, dietary preferences, or special instructions? Let us know here..." rows="4"></textarea>
                </div>
                <button type="submit" class="order-btn"><i class="fas fa-shopping-cart"></i>Place Order</button>
            </form>
        </div>
    </div>
</body>
</html>
